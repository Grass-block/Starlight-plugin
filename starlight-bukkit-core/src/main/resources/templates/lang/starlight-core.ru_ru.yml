    unreject-all: "{global#sys-info}Глобальный дополнительный рендеринг UI был {msg#state-open}."
    reject-renderer: "{global#sys-info}Дополнительный рендеринг UI для компонента интерфейса {#var} был {msg#state-close}."
    unreject-renderer: "{global#sys-info}Дополнительный рендеринг UI для компонента интерфейса {#var} был {msg#state-open}."
    reject-channel: "{global#sys-info}Дополнительный рендеринг UI для функционального компонента {#var} был {msg#state-close}."
    unreject-channel: "{global#sys-info}Дополнительный рендеринг UI для функционального компонента {#var} был {msg#state-open}."
    state-open: "{#green}включено{#gray}"
    state-close: "{#red}отключено{#gray}"
  libraries:
    list: '{#aqua}Загруженные сторонние библиотеки: '
    list-item: "{color(#44FFAA)}[{}]"
    list-hover: |-
      {color(#44FFAA)} {}
      {#gray}Имя Файла: {#white}{}
      {#gray}Размер Файла: {#white}{} КиБ
      {#gray}Дата Загрузки: {#white}{}
      {#gray}Полный Путь: {#white}{}
    password-set: "{global#sys-info}Ваш пароль установлен как {#white}{#var}{#gray}. Пожалуйста, сохраните его в безопасности. Вы можете изменить его с помощью /password."
  about:
    version: "{global#sys-info}Текущая версия: {#var}"
  reload:
    platform-unsupported: "{global#sys-error}Текущая платформа не поддерживает перезагрузку. Используйте {#gold}/reload{#white}"

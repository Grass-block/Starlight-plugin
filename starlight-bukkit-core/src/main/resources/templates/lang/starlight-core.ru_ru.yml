    ui-state-close: "{#white}Текущее Состояние: {#red}[ВЫКЛ]"
    ui-click: "{#gold}[Нажмите для Переключения]"
    ui-title: "{#dark-aqua}Настройки Рендеринга Интерфейса {#white}(Всего {} страниц)"

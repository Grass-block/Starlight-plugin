    prepared: "{global#sys-operation}Выполнен вход в стадию подготовки перезагрузки; блокировка JAR-файла снята для разрешения операций замены. После завершения используйте /starlight reload action для активации горячего обновления."
    reload-logic-updated: "{global#sys-operation}Из-за изменений в основных компонентах теперь вам нужно сначала использовать /starlight reload prepare для входа в стадию подготовки перезагрузки."

    error-lack-any-permission: "{global#error}Недостаточно прав: Отсутствует любое из разрешений в {#var}."
    error-lack-all-permission: "{global#error}Недостаточно прав: Отсутствуют все разрешения в {#var}."
    error-sender-is-not-player: "{global#error}Ошибка цели: Вы должны быть игроком."

    error-internal-exception: "{global#error}Произошла внутренняя ошибка при выполнении этой команды. Проверьте консоль для получения дополнительной информации."

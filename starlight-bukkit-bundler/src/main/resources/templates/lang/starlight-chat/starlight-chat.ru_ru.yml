language:
  -module-name:
    chat-at: Упоминание в чате
    chat-component: Поддержка форматированного текста
    mail: Почта
    chat-filter: Фильтр чата
    chat-report: Жалоба на чат
    mute: Мут чата
  chat-component:
    --tip:
      - '{#gray}В чате, на табличках и в командах (частично поддерживается) вы можете использовать теги форматирования для добавления эффектов к тексту.'
      - '{#gray}Нажмите {click(link,wiki.atcraftmc.cn)}[здесь]{;}{#gray}, чтобы узнать больше.'
  chat-filter:
    reload: "{global#sys-success}Файл правил успешно перезагружен."
    save: "{global#sys-success}Файл правил по умолчанию успешно сохранён."
    reported-warn: "{global#sys-warning}Ваше сообщение ({#var}) было помечено системой как нарушение после жалобы. Пожалуйста, следите за своим поведением."
    outcome-warn: "{global#sys-success}Сообщение ({#var}) игрока ({#var}), на которого поступила жалоба, было признано нарушением и вынесено предупреждение. Спасибо за поддержание порядка в сообществе."
    outcome-punished: "{global#sys-success}Сообщение ({#var}) игрока ({#var}), на которого поступила жалоба, было признано нарушением и применён мут. Спасибо за поддержание порядка в сообществе."
  chat-report:
    not-exist: "{global#sys-error}Запись чата, на которую вы пытаетесь пожаловаться, не существует или уже была рассмотрена."
    not-self: "{global#sys-error}Вы не можете жаловаться на свои собственные сообщения."
    success: "{global#sys-success}Вы отправили жалобу на чат игрока {#var} ({#var})."
    --tip: '{#gray}Если игрок отправляет сообщение с неподобающим содержанием, вы можете нажать "[!]" после текста чата, чтобы пожаловаться.'
  mute:
    message-banned: '{global#sys-info}Вы в муте. Мут будет снят в {#var}.'
    add: '{global#sys-info}Игрок {#var} успешно замучен до {#var}, причина: {#var}.'
    add-target: '{global#sys-info}Вы были замучены администратором {#var} за {#var} до {#var}!'
    remove: '{global#sys-info}Мут игрока {#var} успешно снят.'
    remove-target: '{global#sys-info}Ваш мут снят администратором {#var}!'
    message-unmuted: '{global#sys-error}Ошибка: Игрок {#var} не в муте!'

language:
  -module-name:
    chat-at: Mention de chat
    chat-component: Support de chat en texte enrichi
    mail: Courrier
    chat-filter: Filtre de chat
    chat-report: Signalement de chat
    mute: Mise en sourdine du chat
  chat-component:
    --tip:
      - '{#gray}Dans le chat, les pancartes et les commandes (partiellement supporté), vous pouvez utiliser des balises de texte enrichi pour ajouter des effets au texte.'
      - '{#gray}Cliquez {click(link,wiki.atcraftmc.cn)}[ici]{;}{#gray} pour en savoir plus.'
  chat-filter:
    reload: "{global#sys-success}Fichier de règles rechargé avec succès."
    save: "{global#sys-success}Fichier de règles par défaut enregistré avec succès."
    reported-warn: "{global#sys-warning}Votre message ({#var}) a été signalé et marqué comme infraction par le système. Veuillez surveiller votre comportement."
    outcome-warn: "{global#sys-success}Le message ({#var}) du joueur signalé ({#var}) a été marqué comme infraction et un avertissement a été émis. Merci de contribuer au maintien de l'ordre communautaire."
    outcome-punished: "{global#sys-success}Le message ({#var}) du joueur signalé ({#var}) a été marqué comme infraction et une sourdine a été appliquée. Merci de contribuer au maintien de l'ordre communautaire."
  chat-report:
    not-exist: "{global#sys-error}L'entrée de chat que vous essayez de signaler n'existe pas, ou elle a peut-être déjà été signalée."
    not-self: "{global#sys-error}Vous ne pouvez pas signaler vos propres messages de chat."
    success: "{global#sys-success}Vous avez soumis un signalement de chat contre {#var} ({#var})."
    --tip: '{#gray}Si un joueur envoie un message contenant un contenu inapproprié, vous pouvez cliquer sur le "[!]" après le texte du chat pour le signaler.'
  mute:
    message-banned: '{global#sys-info}Vous êtes mis en sourdine. Votre sourdine sera levée le {#var}.'
    add: '{global#sys-info}Joueur {#var} mis en sourdine jusqu''au {#var}, motif : {#var}.'
    add-target: '{global#sys-info}Vous avez été mis en sourdine par {#var} pour {#var} jusqu''au {#var} !'
    remove: '{global#sys-info}Sourdine du joueur {#var} levée avec succès.'
    remove-target: '{global#sys-info}Votre sourdine a été levée par l''administrateur {#var} !'
    message-unmuted: '{global#sys-error}Erreur : Le joueur {#var} n''est pas mis en sourdine !'

language:
  -module-name:
    ban: 封禁指令
    kick-on-reload: 重载自动踢出
    maintenance: 维护模式
    plugin-manager-command: 命令行插件管理器
    server-info: 服务器信息指令
    tps-bar: TPS可视化条
    vm-garbage-cleaner: 自动化垃圾清理
  ban:
    msg-ban-complete: "{global#sys-success}已封禁玩家 {#var} 至 {#var},原因: {#var}。"
    broadcast: "{global#sys-info}玩家{#var} 因 {#var} 被操作者 {#var} 封禁至 {#var}。"
  vm-garbage-cleaner:
    gc-start: "{global#sys-operation}内存回收开始..."
    gc-end: "{global#sys-operation}内存回收完成, 释放 {#var} MB。"
  maintenance:
    start: "{global#sys-operation}维护开始。"
    end: "{global#sys-operation}维护结束。"
    allow: "{global#sys-operation}已允许 {#var}({#var})在维护期间进入服务器。"
    disallow: "{global#sys-operation}已不再允许 {#var}({#var})在维护期间进入服务器。"
    kick-message:
      - '由于服务器正在维护,您暂时无法进入。'
      - '维护需要一段时间,请您耐心等待,我们对此十分抱歉。'
  kick-on-reload:
    reload-hint:
      - "{#white}服务器正在重载。为保证游戏正常运行, 您已被暂时踢出。"
      - "{#white}请在稍后重新加入。{#return}"
    stop-hint:
      - "{#white}因故障或维护需要，服务器现已关闭。"
      - "{#white}很抱歉给您带来不便。{#return}"
  plugin-manager-command:
    list: "{global#sys-operation}以下是所有插件: {#var}"
    info:
      - "{#yellow}一一一一一一一一一一一一一一一一一一一一一一一一一一一"
      - "{#gray}>>{#aqua} {}: {#return}{}"
      - "{#yellow}一一一一一一一一一一一一一一一一一一一一一一一一一一一"
    info-name: "{#gold}名称{#white}: {}[{}]"
    info-version: "{#gold}版本{#white}: {}"
    info-author: "{#gold}作者{#white}: {}"
    info-desc: "{#gold}简介{#white}: {}"
    info-api: "{#gold}API版本{#white}: {}"
    info-depend: "{#gold}前置{#white}: {}"
    info-soft-depend: "{#gold}软前置{#white}: {}"
    info-main: "{#gold}启动类{#white}: {}"
    info-libs: "{#gold}依赖库{#white}:"
    file-not-found: "{global#error}未找到插件文件 {#var}。"
    plugin-not-found: "{global#error}未找到插件 {#var}。"
    load-failed: "{global#error}未能成功加载插件 {#var}。"
    unload-failed: "{global#error}未能成功卸载插件 {#var}。"
    enable: "{global#operation}成功启用插件 {#var}。"
    disable: "{global#operation}成功停用插件 {#var}。"
    restart: "{global#operation}成功重启插件 {#var}。"
    load: "{global#operation}成功加载插件 {#var}。"
    unload: "{global#operation}成功卸载插件 {#var}。"
    reload: "{global#operation}成功重载插件 {#var}。"
  tps-bar:
    on: "{global#operation}已显示TPS条。"
    off: "{global#operation}已隐藏TPS条。"
  world-object-filter:
    --tip: '{#gray}您可以使用 {#gold}/world-filter{#gray} 来屏蔽不想看到的告示牌或旗帜。'
    notify-title: "{#aqua}您的世界内容屏蔽设置:"
    notify-state-flag: "{#gray}旗帜图案屏蔽: {#aqua}{} {click(command,/world-filter flags)}{#white}[{#purple}切换{#white}]"
    notify-state-signs: "{#gray}告示牌文本屏蔽: {#aqua}{} {click(command,/world-filter signs)}{#white}[{#purple}切换{#white}]"
    flag-enable: "{global#sys-info}您已{global#state-open}旗帜纹理屏蔽, 可能需要重新加载或位移来刷新更改。"
    flag-disable: "{global#sys-info}您已{global#state-close}旗帜纹理屏蔽, 可能需要重新加载或位移来刷新更改。"
    sign-enable: "{global#sys-info}您已{global#state-open}告示牌内容屏蔽, 可能需要重新加载或位移来刷新更改。"
    sign-disable: "{global#sys-info}您已{global#state-close}告示牌内容屏蔽, 可能需要重新加载或位移来刷新更改。"
    action-flag-hint: "{global#info}按照您的设置，当前旗帜内容已被屏蔽。(本消息此会话内不再提示)"
    action-sign-hint: "{global#info}按照您的设置，当前告示牌内容已被屏蔽。(本消息此会话内不再提示)"
    action-flag-banned: "{global#warning}服务端已开启严格模式，此旗帜禁止放置。"
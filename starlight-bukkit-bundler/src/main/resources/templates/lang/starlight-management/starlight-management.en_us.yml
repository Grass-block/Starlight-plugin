language:
  -module-name:
    ban: Ban Commands
    kick-on-reload: Auto-Kick on Reload
    maintenance: Maintenance Mode
    plugin-manager-command: Command-Line Plugin Manager
    server-info: Server Information Commands
    tps-bar: TPS Visual Bar
    vm-garbage-cleaner: Automatic Garbage Collection
  ban:
    msg-ban-complete: "{global#sys-success}Banned player {#var} until {#var}, reason: {#var}."
    broadcast: "{global#sys-info}Player {#var} was banned by {#var} for {#var} until {#var}."
  vm-garbage-cleaner:
    gc-start: "{global#sys-operation}Memory collection started..."
    gc-end: "{global#sys-operation}Memory collection completed, freed {#var} MB."
  maintenance:
    start: "{global#sys-operation}Maintenance started."
    end: "{global#sys-operation}Maintenance ended."
    allow: "{global#sys-operation}Allowed {#var}({#var}) to enter during maintenance."
    disallow: "{global#sys-operation}Disallowed {#var}({#var}) from entering during maintenance."
    kick-message:
      - 'The server is currently under maintenance, you cannot enter at this time.'
      - 'Maintenance may take a while, please be patient. We sincerely apologize for the inconvenience.'
  kick-on-reload:
    reload-hint:
      - "{#white}The server is reloading. To ensure proper operation, you have been temporarily kicked."
      - "{#white}Please rejoin shortly.{#return}"
    stop-hint:
      - "{#white}The server has been shut down due to failure or maintenance."
      - "{#white}We apologize for the inconvenience.{#return}"
  plugin-manager-command:
    list: "{global#sys-operation}Plugin list: {#var}"
    info:
      - "{#yellow}一一一一一一一一一一一一一一一一一一一一一一一一一一一"
      - "{#gray}>>{#aqua} {}: {#return}{}"
      - "{#yellow}一一一一一一一一一一一一一一一一一一一一一一一一一一一"
    info-name: "{#gold}Name{#white}: {}[{}]"
    info-version: "{#gold}Version{#white}: {}"
    info-author: "{#gold}Author{#white}: {}"
    info-desc: "{#gold}Description{#white}: {}"
    info-api: "{#gold}API Version{#white}: {}"
    info-depend: "{#gold}Dependencies{#white}: {}"
    info-soft-depend: "{#gold}Soft Dependencies{#white}: {}"
    info-main: "{#gold}Main Class{#white}: {}"
    info-libs: "{#gold}Libraries{#white}:"
    file-not-found: "{global#error}Plugin file {#var} not found."
    plugin-not-found: "{global#error}Plugin {#var} not found."
    load-failed: "{global#error}Failed to load plugin {#var}."
    unload-failed: "{global#error}Failed to unload plugin {#var}."
    enable: "{global#operation}Successfully enabled plugin {#var}."
    disable: "{global#operation}Successfully disabled plugin {#var}."
    restart: "{global#operation}Successfully restarted plugin {#var}."
    load: "{global#operation}Successfully loaded plugin {#var}."
    unload: "{global#operation}Successfully unloaded plugin {#var}."
    reload: "{global#operation}Successfully reloaded plugin {#var}."
  tps-bar:
    on: "{global#operation}TPS bar displayed."
    off: "{global#operation}TPS bar hidden."
  world-object-filter:
    --tip: '{#gray}You can use {#gold}/world-filter{#gray} to hide signs or banners you don''t want to see.'
    notify-title: "{#aqua}Your world content filter settings:"
    notify-state-flag: "{#gray}Banner Filter: {#aqua}{} {click(command,/world-filter flags)}{#white}[{#purple}Toggle{#white}]"
    notify-state-signs: "{#gray}Sign Text Filter: {#aqua}{} {click(command,/world-filter signs)}{#white}[{#purple}Toggle{#white}]"
    flag-enable: "{global#sys-info}Banner texture filtering {global#state-open}. You may need to reload or move to see changes."
    flag-disable: "{global#sys-info}Banner texture filtering {global#state-close}. You may need to reload or move to see changes."
    sign-enable: "{global#sys-info}Sign content filtering {global#state-open}. You may need to reload or move to see changes."
    sign-disable: "{global#sys-info}Sign content filtering {global#state-close}. You may need to reload or move to see changes."
    action-flag-hint: "{global#info}Based on your settings, this banner content has been filtered. (This message will not appear again this session.)"
    action-sign-hint: "{global#info}Based on your settings, this sign content has been filtered. (This message will not appear again this session.)"
    action-flag-banned: "{global#warning}Strict mode is enabled on the server; this banner is not allowed to be placed."

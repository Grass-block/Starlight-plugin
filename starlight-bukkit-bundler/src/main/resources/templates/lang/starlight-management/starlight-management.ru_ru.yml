language:
  -module-name:
    ban: Команды бана
    kick-on-reload: Авто-кик при перезагрузке
    maintenance: Режим обслуживания
    plugin-manager-command: Командный менеджер плагинов
    server-info: Команды информации о сервере
    tps-bar: Визуальная панель TPS
    vm-garbage-cleaner: Автоматическая очистка памяти
  ban:
    msg-ban-complete: "{global#sys-success}Игрок {#var} забанен до {#var}, причина: {#var}."
    broadcast: "{global#sys-info}Игрок {#var} забанен администратором {#var} за {#var} до {#var}."
  vm-garbage-cleaner:
    gc-start: "{global#sys-operation}Запущена очистка памяти..."
    gc-end: "{global#sys-operation}Очистка памяти завершена, освобождено {#var} МБ."
  maintenance:
    start: "{global#sys-operation}Обслуживание начато."
    end: "{global#sys-operation}Обслуживание завершено."
    allow: "{global#sys-operation}Разрешён вход {#var}({#var}) во время обслуживания."
    disallow: "{global#sys-operation}Запрещён вход {#var}({#var}) во время обслуживания."
    kick-message:
      - 'Сервер в настоящее время находится на обслуживании, вы не можете войти.'
      - 'Обслуживание может занять некоторое время, пожалуйста, подождите. Приносим искренние извинения за неудобства.'
  kick-on-reload:
    reload-hint:
      - "{#white}Сервер перезагружается. Для обеспечения корректной работы вы были временно исключены."
      - "{#white}Пожалуйста, подключитесь снова через некоторое время.{#return}"
    stop-hint:
      - "{#white}Сервер был остановлен из-за сбоя или обслуживания."
      - "{#white}Приносим извинения за неудобства.{#return}"
  plugin-manager-command:
    list: "{global#sys-operation}Список плагинов: {#var}"
    info:
      - "{#yellow}一一一一一一一一一一一一一一一一一一一一一一一一一一一"
      - "{#gray}>>{#aqua} {}: {#return}{}"
      - "{#yellow}一一一一一一一一一一一一一一一一一一一一一一一一一一一"
    info-name: "{#gold}Название{#white}: {}[{}]"
    info-version: "{#gold}Версия{#white}: {}"
    info-author: "{#gold}Автор{#white}: {}"
    info-desc: "{#gold}Описание{#white}: {}"
    info-api: "{#gold}Версия API{#white}: {}"
    info-depend: "{#gold}Зависимости{#white}: {}"
    info-soft-depend: "{#gold}Мягкие зависимости{#white}: {}"
    info-main: "{#gold}Главный класс{#white}: {}"
    info-libs: "{#gold}Библиотеки{#white}:"
    file-not-found: "{global#error}Файл плагина {#var} не найден."
    plugin-not-found: "{global#error}Плагин {#var} не найден."
    load-failed: "{global#error}Не удалось загрузить плагин {#var}."
    unload-failed: "{global#error}Не удалось выгрузить плагин {#var}."
    enable: "{global#operation}Плагин {#var} успешно включён."
    disable: "{global#operation}Плагин {#var} успешно отключён."
    restart: "{global#operation}Плагин {#var} успешно перезапущен."
    load: "{global#operation}Плагин {#var} успешно загружен."
    unload: "{global#operation}Плагин {#var} успешно выгружен."
    reload: "{global#operation}Плагин {#var} успешно перезагружен."
  tps-bar:
    on: "{global#operation}Панель TPS отображена."
    off: "{global#operation}Панель TPS скрыта."
  world-object-filter:
    --tip: '{#gray}Вы можете использовать {#gold}/world-filter{#gray}, чтобы скрыть таблички или флаги, которые вы не хотите видеть.'
    notify-title: "{#aqua}Настройки фильтрации содержимого мира:"
    notify-state-flag: "{#gray}Фильтр флагов: {#aqua}{} {click(command,/world-filter flags)}{#white}[{#purple}Переключить{#white}]"
    notify-state-signs: "{#gray}Фильтр текста табличек: {#aqua}{} {click(command,/world-filter signs)}{#white}[{#purple}Переключить{#white}]"
    flag-enable: "{global#sys-info}Фильтрация текстур флагов {global#state-open}. Возможно, потребуется перезагрузка или перемещение, чтобы увидеть изменения."
    flag-disable: "{global#sys-info}Фильтрация текстур флагов {global#state-close}. Возможно, потребуется перезагрузка или перемещение, чтобы увидеть изменения."
    sign-enable: "{global#sys-info}Фильтрация содержимого табличек {global#state-open}. Возможно, потребуется перезагрузка или перемещение, чтобы увидеть изменения."
    sign-disable: "{global#sys-info}Фильтрация содержимого табличек {global#state-close}. Возможно, потребуется перезагрузка или перемещение, чтобы увидеть изменения."
    action-flag-hint: "{global#info}Согласно вашим настройкам, содержимое этого флага было скрыто. (Это сообщение не появится снова в этой сессии.)"
    action-sign-hint: "{global#info}Согласно вашим настройкам, содержимое этой таблички было скрыто. (Это сообщение не появится снова в этой сессии.)"
    action-flag-banned: "{global#warning}На сервере включён строгий режим; этот флаг запрещён к размещению."

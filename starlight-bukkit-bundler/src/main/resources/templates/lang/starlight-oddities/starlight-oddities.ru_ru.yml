language:
  -module-name:
    elevator: Блок лифта
  elevator:
    item-name: '{#aqua}Лифт'
    item-lore:
      - '{#gray}Совершенно обычный блок лифта.'
      - '{#gray}Если {#white}разместить их вертикально и очистить пространство{#gray},'
      - '{#gray}и {#white}прыгать или красться{#gray} на них,'
      - '{#gray}может произойти кое-что {#white}интересное{#gray}...'
    --tip:
      - "{#gray}Создайте блоки лифта из золотых слитков, красной пыли и поршней, прыгайте или крадитесь на них для быстрого перемещения вверх/вниз."
      - "{#gray}Для правильной работы лифта, 2 блока над ним должны быть воздухом."
      - "{#gray}Вы можете посмотреть рецепт {click(link,https://example.org){#white}[{#aqua}здесь{#white}]{#gray}."

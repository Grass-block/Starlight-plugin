plugins {
    id 'java'
}

apply from: rootDir.getAbsolutePath()+"/gbuild.gradle"

applyGlobalScript("Publish/ProjectOutput.gradle")

group = 'org.atcraftmc'

repositories {
    papermcRepo()
}

dependencies {
    implementation project(":lib-starlight-shared")

    implementation projectLib('bukkit-configurations-api')

    compileOnly 'com.velocitypowered:velocity-api:3.3.0-SNAPSHOT'
    annotationProcessor 'com.velocitypowered:velocity-api:3.3.0-SNAPSHOT'

    implementation gbuildLib('me.gb2022.commons:commons-nbt')
    implementation gbuildLib('me.gb2022.commons:commons-math')
    implementation gbuildLib('me.gb2022.commons:commons-container')
    implementation gbuildLib('me.gb2022.commons:commons-general')
    implementation gbuildLib('me.gb2022.commons:commons-event')
    implementation gbuildLib('me.gb2022.commons:commons-reflection')

    implementation gbuildLib("me.gb2022.apm:apm-remote")

    compileOnly 'io.netty:netty-buffer:4.1.100.Final'

    compileOnly "org.apache.logging.log4j:log4j-api:2.8.1"
    implementation 'org.slf4j:log4j-over-slf4j:2.0.0-alpha1'
    implementation 'com.google.guava:guava:31.0.1-jre'

    implementation gbuildLib("me.gb2022:modular-main")
    implementation gbuildLib("org.atcraftmc.qlib:qlib-base")
}

jar {
    archiveBaseName = "starlight-velocity"
}
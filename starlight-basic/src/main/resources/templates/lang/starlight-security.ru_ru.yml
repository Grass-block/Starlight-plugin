language:
  -module-name:
    advanced-permission-control: Расширенный контроль прав
    explosion-defender: Защита от взрывов
    img-regulation-sync: Синхронизация регулирования IMG
    ip-defender: Определение IP-адреса
    permission-manager: Простой контроль прав
    we-operation-defender: Мониторинг операций WorldEdit

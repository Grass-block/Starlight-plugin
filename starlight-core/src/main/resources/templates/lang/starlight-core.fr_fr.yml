    reload: "{global#sys-operation}Variables globales rechargées avec succès."
    restore: "{global#sys-operation}Variables globales restaurées avec succès."
    sync: "{global#sys-operation}Variables globales synchronisées avec succès."
  language:
    restore-all: "{global#sys-operation}Tous les fichiers de langue ont été restaurés."
    reload-all: "{global#sys-operation}Tous les fichiers de langue ont été rechargés."
    sync-all: "{global#sys-operation}Tous les fichiers de langue ont été synchronisés."
    restore: "{global#sys-operation}Le fichier de langue {#var} a été restauré."
    reload: "{global#sys-operation}Le fichier de langue {#var} a été rechargé."
    sync: "{global#sys-operation}Le fichier de langue {#var} a été synchronisé."

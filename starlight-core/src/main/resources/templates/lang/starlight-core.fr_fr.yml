    require: "{global#sys-info}Une nouvelle version {#var} est disponible. {click(link,{})}{#white}[{#green}Voir{#white}]{;}"
    no-require: "{global#sys-info}Votre version {#var} est déjà la plus récente. Aucune mise à jour n''est nécessaire."
    exception: "{global#sys-info}Une erreur est survenue lors de la vérification des versions. Veuillez consulter la console."
    checking: "{global#sys-info}Vérification de la version..."
  data-update:
    start: "{global#sys-info}L''importation/mise à niveau des données pour l''élément {#var} a commencé. Veuillez surveiller les messages de la console."

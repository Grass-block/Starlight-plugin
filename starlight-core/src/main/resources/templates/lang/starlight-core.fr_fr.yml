    password-set: "{global#sys-info}Votre mot de passe a été défini sur {#white}{#var}{#gray}. Veuillez le conserver en sécurité. Vous pouvez le changer avec /password."
  about:
    version: "{global#sys-info}Version actuelle : {#var}"
  reload:
    platform-unsupported: "{global#sys-error}La plateforme actuelle ne prend pas en charge le rechargement. Veuillez utiliser {#gold}/reload{#white}"
    fastboot-unsupported: "{global#sys-error}FastBoot (Démarrage Rapide) ne prend pas en charge le rechargement. Veuillez utiliser {#gold}/reload{#gray} ou désactiver FastBoot."
    complete: "{global#sys-operation}Starlight et tous les packs d''extension enregistrés ont été rechargés avec succès."
    prepared: "{global#sys-operation}Phase de préparation au rechargement atteinte ; le verrouillage du fichier JAR a été libéré pour permettre les opérations de remplacement. Après achèvement, veuillez utiliser /starlight reload action pour activer la mise à jour à chaud."
    reload-logic-updated: "{global#sys-operation}En raison de changements dans les composants principaux, vous devez maintenant utiliser /starlight reload prepare pour entrer d''abord en phase de préparation au rechargement."
  folia-compat:
    disabled: "{global#sys-error}Cette fonctionnalité est indisponible car Folia ne dispose pas de l''API compatible correspondante."
    reload-warn: "{global#sys-error}Le rechargement sur Folia empêchera tous les plugins et commandes de se charger correctement. Vous devriez redémarrer le serveur !"

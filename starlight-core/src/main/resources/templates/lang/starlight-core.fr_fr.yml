    list: '{#aqua}Bibliothèques tierces chargées : '
    list-item: "{color(#44FFAA)}[{}]"
    list-hover: |-
      {color(#44FFAA)} {}
      {#gray}Nom du Fichier : {#white}{}
      {#gray}Taille du Fichier : {#white}{} Kio
      {#gray}Date de Téléchargement : {#white}{}
      {#gray}Chemin Complet : {#white}{}
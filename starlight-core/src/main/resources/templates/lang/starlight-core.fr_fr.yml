    default-desc: "Ce composant d''interface n''a pas de description."
    ui-state-open: "{#white}État Actuel : {#green}[ACTIVÉ]"
    ui-state-close: "{#white}État Actuel : {#red}[DÉSACTIVÉ]"
    ui-click: "{#gold}[Cliquer pour Basculer]"
    ui-title: "{#dark-aqua}Paramètres de Rendu d''Interface {#white}({} pages au total)"

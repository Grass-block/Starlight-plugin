    view: "{global#sys-info}Voici le journal de mise à jour pour la version {#var} de Starlight :"
    not-found: "{global#sys-error}Journal de mise à jour pour la version {#var} de Starlight introuvable."
  locale:
    set: "{global#sys-info}La langue de votre serveur a été définie sur {#var}. Certains affichages peuvent nécessiter une reconnexion pour se mettre à jour."

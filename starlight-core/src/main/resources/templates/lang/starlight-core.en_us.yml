language:
  -module-name:
    custom-language-pack-loader: '[Core] Custom Plugin Language Loader'
    installation-check: '[Core] Installation Integrity Check'
    modrinth-version-check: '[Core] Modrinth Update Service'
    papi-support: '[Core] PlaceHolderAPI Interaction Support'
    platform-patcher: '[Core] Platform Difference Patcher'
    protocol-lib-injector: '[Core] ProtocolLib Platform Proxy'
    version-log-viewer: '[Core] Update Log Viewer'
  custom-block:
    give: '{global#success}Successfully obtained {#var} *1'
    give-failed: '{global#error}Custom block named {#var} does not exist.'
  global-vars:
    sys-info: "{#aqua}System{#dark_aqua} > {#gray}"
    sys-warning: "{#yellow}System{#dark_aqua} > {#gray}"
    sys-error: "{#red}System{#dark_aqua} > {#gray}"
    sys-success: "{#green}System{#dark_aqua} > {#gray}"
    sys-operation: "{#light-purple}System{#dark_aqua} > {#gray}"
    hint: "{#gray}[{#white}!{#gray}]{#gray}"
    success: "{#gray}[{#green}!{#gray}]{#gray}"
    info: "{#gray}[{#aqua}!{#gray}]{#gray}"
    warning: "{#gray}[{#yellow}!{#gray}]{#gray}"
    error: "{#gray}[{#red}!{#gray}]{#gray}"
    operation: "{#gray}[{#light-purple}!{#gray}]{#gray}"
  command:
    exception: "{global#sys-error}Syntax error, or an internal error occurred while executing this command."
    lack-permission: "{global#sys-error}Sorry, you don't have permission ({#var}) to execute this command."
    player-only: "{global#sys-error}This command can only be executed by a player."
    sync-commands: "{global#sys-operation}Command synchronization completed."

    error-missing: "{global#error}Syntax error: Missing argument at {#var}."
    error-argument-type-int: "{global#error}Syntax error: Expected integer at {#var}, got {#var}."
    error-argument-type-float: "{global#error}Syntax error: Expected float at {#var}, got {#var}."
    error-argument-type-double: "{global#error}Syntax error: Expected double at {#var}, got {#var}."
    error-argument-type-enum: "{global#error}Syntax error: Expected one of {#var} at {#var}, got {#var}."
    error-require-player: "{global#error}Syntax error: Expected a player at {#var}, but ({#var}) does not exist."
    error-argument-bound: "{global#error}Syntax error: Value at {#var} should be between {#var}-{#var}, got {#var}."

    error-lack-permission: "{global#error}Insufficient permission: Missing permission {#var}."
    error-lack-any-permission: "{global#error}Insufficient permission: Missing any one of the permissions in {#var}."
    error-lack-all-permission: "{global#error}Insufficient permission: Missing all of the permissions in {#var}."
    error-sender-is-not-player: "{global#error}Target error: You need to be a player."

    error-internal-exception: "{global#error}An internal error occurred while executing this command. Check the console for more information."
  module:
    list: "{global#sys-operation}Here are all modules: {#return}{}"
    enable-all: "{global#sys-operation}Successfully enabled all modules."
    disable-all: "{global#sys-operation}Successfully disabled all modules."
    reload-all: "{global#sys-operation}Successfully reloaded all modules."
    enable: "{global#sys-operation}Successfully enabled module {#var}."
    disable: "{global#sys-operation}Successfully disabled module {#var}."
    reload: "{global#sys-operation}Successfully reloaded module {#var}."
    not-found: "{global#sys-error}Module {#var} not found."
    internal-error: "{global#sys-error}An internal error occurred while operating module {#var}."
    already-op: "{global#sys-error}Module {#var} is already in the requested state."
    blocked-internal: "{global#sys-error}You cannot operate the [Built-in] module {#var}, as it may cause errors."
  package:
    list: "{global#sys-operation}Here are all extension packages: {#return}{}"
    enable-all: "{global#sys-operation}Successfully enabled all extension packages."
    disable-all: "{global#sys-operation}Successfully disabled all extension packages."
    reload-all: "{global#sys-operation}Successfully reloaded all extension packages."
    enable: "{global#sys-operation}Successfully enabled extension package {#var}."
    disable: "{global#sys-operation}Successfully disabled extension package {#var}."
    reload: "{global#sys-operation}Successfully reloaded extension package {#var}."
    not-found: "{global#sys-error}Extension package {#var} not found."
    internal-error: "{global#sys-error}An internal error occurred while operating extension package {#var}."
    already-op: "{global#sys-error}Extension package {#var} is already in the requested state."
    blocked-internal: "{global#sys-error}You cannot operate the [Built-in] package {#var}, as it may cause errors."
  config:
    reload-all: "{global#sys-operation}All configuration files have been reloaded."
    restore-all: "{global#sys-operation}All configuration files have been restored."
    sync-all: "{global#sys-operation}All configuration files have been synchronized."
    reload: "{global#sys-operation}Configuration file {#var} has been reloaded."
    restore: "{global#sys-operation}Configuration file {#var} has been restored."
    sync: "{global#sys-operation}Configuration file {#var} has been synchronized."
  global-var:
    reload: "{global#sys-operation}Successfully reloaded global variables."
    restore: "{global#sys-operation}Successfully restored global variables."
    sync: "{global#sys-operation}Successfully synchronized global variables."
  language:
    restore-all: "{global#sys-operation}All language files have been restored."
    reload-all: "{global#sys-operation}All language files have been reloaded."
    sync-all: "{global#sys-operation}All language files have been synchronized."
    restore: "{global#sys-operation}Language file {#var} has been restored."
    reload: "{global#sys-operation}Language file {#var} has been reloaded."
    sync: "{global#sys-operation}Language file {#var} has been synchronized."
  auth:
    password-set: "{global#sys-info}Your password has been set to {#white}{#var}{#gray}. Please keep it safe. You can change it with /password."
  about:
    version: "{global#sys-info}Current version: {#var}"
  reload:
    platform-unsupported: "{global#sys-error}The current platform does not support reloading. Please use {#gold}/reload{#white}"
    fastboot-unsupported: "{global#sys-error}FastBoot (Quick Start) does not support reloading. Please use {#gold}/reload{#gray} or disable FastBoot."
    complete: "{global#sys-operation}Successfully reloaded Starlight and all registered extension packages."
    prepared: "{global#sys-operation}Entered reload preparation stage; JAR file lock has been released to allow replacement operations. After completion, please use /starlight reload action to activate the hot update."
    reload-logic-updated: "{global#sys-operation}Due to core component changes, you now need to use /starlight reload prepare to enter the reload preparation stage first."
  folia-compat:
    disabled: "{global#sys-error}This feature is unavailable because Folia lacks the corresponding compatible API."
    reload-warn: "{global#sys-error}Reloading on Folia will cause all plugins and commands to fail to load properly. You should restart the server!"
  version-log-viewer:
    view: "{global#sys-info}Here is the update log for Starlight version {#var}:"
    not-found: "{global#sys-error}Update log for Starlight version {#var} not found."
  locale:
    set: "{global#sys-info}Your server language has been set to {#var}. Some displays may require re-login to update."
    preset: "{global#sys-info}Detected your language as {#var}. If incorrect, please use {#gold}/locale [language]{#gray} to select."
  modrinth-version-check:
    require: "{global#sys-info}A new version {#var} is available. {click(link,{})}{#white}[{#green}View{#white}]{;}"
    no-require: "{global#sys-info}Your version {#var} is already the latest. No update is required."
    exception: "{global#sys-info}An error occurred while checking versions. Please check the console."
    checking: "{global#sys-info}Checking version..."
  data-update:
    start: "{global#sys-info}Data import/upgrade for item {#var} has started. Please monitor console messages."
    none: "{global#sys-error}No data import items related to {#var} were found."
    done: "{global#sys-info}Data import completed."
  libraries:
    list: '{#aqua}Loaded third-party dependency libraries: '
    list-item: "{color(#44FFAA)}[{}]"
    list-hover: |-
      {color(#44FFAA)} {}
      {#gray}File Name: {#white}{}
      {#gray}File Size: {#white}{} KiB
      {#gray}Download Date: {#white}{}
      {#gray}Full Path: {#white}{}
  ban-service:
    default-line:
      - '{#gray}You have been banned from {#var} for {#var}.'
      - '{#gray}Your ban will end on {#var}.'
    default-kick-line: '{#gray}You have been kicked from the game: {#var}'
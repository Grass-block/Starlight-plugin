language:
  -module-name:
    custom-language-pack-loader: '[核心]自訂插件語言載入器'
    installation-check: '[核心]安裝完整性檢查'
    modrinth-version-check: '[核心]Modrinth更新服務'
    papi-support: '[核心]PlaceHolderAPI互動支援'
    platform-patcher: '[核心]平台差異修補'
    protocol-lib-injector: '[核心]ProtocolLib平台代理'
    version-log-viewer: '[核心]更新日誌檢視器'
    player-view-customization: '[核心]玩家介面自訂 %player_allow_flight%'
  custom-block:
    give: '{global#success}成功獲取 {#var} *1'
    give-failed: '{global#error}不存在名為 {#var} 的自訂方塊。'
  global-vars:
    sys-info: "{#aqua}系統{#dark_aqua} > {#gray}"
    sys-warning: "{#yellow}系統{#dark_aqua} > {#gray}"
    sys-error: "{#red}系統{#dark_aqua} > {#gray}"
    sys-success: "{#green}系統{#dark_aqua} > {#gray}"
    sys-operation: "{#light-purple}系統{#dark_aqua} > {#gray}"
    hint: "{#gray}[{#white}!{#gray}]{#gray}"
    success: "{#gray}[{#green}!{#gray}]{#gray}"
    info: "{#gray}[{#aqua}!{#gray}]{#gray}"
    warning: "{#gray}[{#yellow}!{#gray}]{#gray}"
    error: "{#gray}[{#red}!{#gray}]{#gray}"
    operation: "{#gray}[{#light-purple}!{#gray}]{#gray}"
  command:
    exception: "{global#sys-error}語法有誤，或執行該指令時出現了內部錯誤。"
    lack-permission: "{global#sys-error}很抱歉，你沒有執行該指令的權限({#var})。"
    player-only: "{global#sys-error}該指令只允許玩家執行。"
    sync-commands: "{global#sys-operation}指令同步完成。"

    error-missing: "{global#error}語法有誤: 在 {#var} 處缺少參數。"
    error-argument-type-int: "{global#error}語法有誤: 在 {#var} 處應為整數，實際輸入 {#var}。"
    error-argument-type-float: "{global#error}語法有誤: 在 {#var} 處應為浮點數，實際輸入 {#var}。"
    error-argument-type-double: "{global#error}語法有誤: 在 {#var} 處應為雙精度浮點數，實際輸入 {#var}。"
    error-argument-type-enum: "{global#error}語法有誤: 在 {#var} 處應為{#var}中的一個，實際輸入 {#var}。"
    error-require-player: "{global#error}語法有誤: 在 {#var} 處需要一個玩家，實際({#var})不存在。"
    error-argument-bound: "{global#error}語法有誤: 在 {#var} 處數值應處於 {#var}-{#var} 區間內，實際為{#var}。"

    error-lack-permission: "{global#error}權限不足: 缺少權限 {#var}。"
    error-lack-any-permission: "{global#error}權限不足: 缺少 {#var} 中的任意一個權限。"
    error-lack-all-permission: "{global#error}權限不足: 缺少 {#var} 中的所有權限。"
    error-sender-is-not-player: "{global#error}目標錯誤: 您需要為一名玩家。"

    error-internal-exception: "{global#error}執行此指令時出現內部錯誤，查看控制台獲得更多資訊。"
  module:
    list: "{global#sys-operation}以下是全部模組: {#return}{}"
    enable-all: "{global#sys-operation}成功啟用所有模組。"
    disable-all: "{global#sys-operation}成功關閉所有模組。"
    reload-all: "{global#sys-operation}成功重新載入所有模組。"
    enable: "{global#sys-operation}成功啟用模組 {#var}。"
    disable: "{global#sys-operation}成功關閉模組 {#var}。"
    reload: "{global#sys-operation}成功重新載入模組 {#var}。"
    not-found: "{global#sys-error}未找到模組 {#var}。"
    internal-error: "{global#sys-error}操作模組 {#var} 時出現內部錯誤。"
    already-op: "{global#sys-error}模組 {#var} 已處於請求的狀態。"
    blocked-internal: "{global#sys-error}你無法操作 [內建] 模組 {#var} , 因為這可能導致錯誤。"
  package:
    list: "{global#sys-operation}以下是全部擴展包: {#return}{}"
    enable-all: "{global#sys-operation}成功啟用所有擴展包。"
    disable-all: "{global#sys-operation}成功關閉所有擴展包。"
    reload-all: "{global#sys-operation}成功重新載入所有擴展包。"
    enable: "{global#sys-operation}成功啟用擴展包 {#var}。"
    disable: "{global#sys-operation}成功關閉擴展包 {#var}。"
    reload: "{global#sys-operation}成功重新載入擴展包 {#var}。"
    not-found: "{global#sys-error}未找到擴展包 {#var}。"
    internal-error: "{global#sys-error}操作擴展包 {#var} 時出現內部錯誤。"
    already-op: "{global#sys-error}擴展包 {#var} 已處於請求的狀態。"
    blocked-internal: "{global#sys-error}你無法操作 [內建] 套件 {#var} , 因為這可能導致錯誤。"
  config:
    reload-all: "{global#sys-operation}已重新載入所有設定檔。"
    restore-all: "{global#sys-operation}已重設所有設定檔。"
    sync-all: "{global#sys-operation}已同步所有設定檔。"
    reload: "{global#sys-operation}已重新載入設定檔 {#var}。"
    restore: "{global#sys-operation}已重設設定檔 {#var}。"
    sync: "{global#sys-operation}已同步設定檔 {#var}。"
  global-var:
    reload: "{global#sys-operation}成功重新載入全域變數。"
    restore: "{global#sys-operation}成功重設全域變數。"
    sync: "{global#sys-operation}成功同步全域變數。"
  language:
    restore-all: "{global#sys-operation}已重設所有語言檔案。"
    reload-all: "{global#sys-operation}已重新載入所有語言檔案。"
    sync-all: "{global#sys-operation}已同步所有語言檔案。"
    restore: "{global#sys-operation}已重設語言檔案 {#var}。"
    reload: "{global#sys-operation}已重新載入語言檔案 {#var}。"
    sync: "{global#sys-operation}已同步語言檔案 {#var}。"
  auth:
    password-set: "{global#sys-info}你的密碼被設為 {#white}{#var}{#gray} ,請注意妥善儲存。當然, 你可以用/password來改變它。"
  about:
    version: "{global#sys-info}目前版本: {#var}"
  reload:
    platform-unsupported: "{global#sys-error}目前的平台不支援重新載入，請 {#gold}/reload{#white}"
    fastboot-unsupported: "{global#sys-error}FastBoot(快速啟動)不支援重新載入，請 {#gold}/reload{#gray} 或關閉FastBoot。"
    complete: "{global#sys-operation}成功重新載入 Starlight 及全部已註冊擴展包。"
    prepared: "{global#sys-operation}已進入重新載入預備，jar檔案鎖已釋放以允許替換操作。完成後請使用 /starlight reload action 啟用熱更新。"
    reload-logic-updated: "{global#sys-operation}由於核心元件變化，現在你需要先用 /starlight reload prepare 進入重新載入預備。"
  folia-compat:
    disabled: "{global#sys-error}該功能因為Folia無相應相容API而無法使用。"
    reload-warn: "{global#sys-error}Folia的重新載入會導致所有插件和指令無法正常載入, 你應該重啟伺服器!"
  version-log-viewer:
    view: "{global#sys-info}以下是 Starlight 版本 {#var} 的更新日誌:"
    not-found: "{global#sys-error}未找到 Starlight 版本 {#var} 的更新日誌。"
  locale:
    set: "{global#sys-info}你的伺服器語言已被設為 {#var}, 部分顯示可能需要重新進入才能更新。"
    preset: "{global#sys-info}偵測到您的語言為 {#var}. 如語言錯誤, 請使用{#gold}/locale [語言]{#gray}進行選擇。"
  modrinth-version-check:
    require: "{global#sys-info}有新的版本 {#var}, {click(link,{})}{#white}[{#green}檢視{#white}]{;}"
    no-require: "{global#sys-info}您的版本已經為最新版 {#var}，無需進行更新。"
    exception: "{global#sys-info}檢查版本時出現錯誤，請查看控制台。"
    checking: "{global#sys-info}正在檢查版本..."
  data-update:
    start: "{global#sys-info}已開始對項目{#var}進行資料匯入升級, 請留意控制台資訊。"
    none: "{global#sys-error}未找到{#var}相關的資料匯入項目。"
    done: "{global#sys-info}資料匯入完成。"
  libraries:
    list: '{#aqua}已載入的第三方依賴庫: '
    list-item: "{color(#44FFAA)}[{}]"
    list-hover: |-
      {color(#44FFAA)} {}
      {#gray}檔案名稱: {#white}{}
      {#gray}檔案大小: {#white}{} KiB
      {#gray}下載日期: {#white}{}
      {#gray}完整路徑: {#white}{}
  ban-service:
    default-line:
      - '{#gray}你已被 {#var} 因 {#var} 封鎖。'
      - '{#gray}你的封鎖將在 {#var} 結束。'
    default-kick-line: '{#gray}你已被踢出遊戲: {#var}'
  player-view-customization:
    default-desc: "該介面元件未提供描述。"
    ui-state-open: "{#white}目前狀態: {#green}[開]"
    ui-state-close: "{#white}目前狀態: {#red}[關]"
    ui-click: "{#gold}[點擊切換]"
    ui-title: "{#dark-aqua}介面渲染設定 {#white}(共 {} 頁)"

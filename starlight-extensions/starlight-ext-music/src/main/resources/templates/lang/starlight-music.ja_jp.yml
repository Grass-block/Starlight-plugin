    ui-legacy-control-close: "{#gray}旧バージョン解析を有効: [OFF]"
    ui-cancel: "{#red}再生停止"
  music-game:
    m-puncher-diamond-name: "{#white}音楽ビーター{#gray}[{#aqua}青{#gray}]"
    m-puncher-diamond-lore: "{#gray}青い音符を叩くためのリズムスティック..."
    m-puncher-gold-name: "{#white}音楽ビーター{#gray}[{#gold}金{#gray}]"
    m-puncher-gold-lore: "{#gray}金色の音符を叩くためのリズムスティック..."
    m-puncher-iron-name: "{#white}音楽ビーター{#gray}[{#white}白{#gray}]"
    m-puncher-iron-lore: "{#gray}白い音符を叩くためのリズムスティック..."

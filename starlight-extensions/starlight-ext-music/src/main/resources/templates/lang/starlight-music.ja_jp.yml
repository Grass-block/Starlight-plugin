    timeout: "{global#sys-error}コンテンツサーバーからファイル {#var} をダウンロードできません。"
    ui-title: "{#dark-aqua}ミュージックプレイヤー {#white}(全 {} ページ)"
    ui-click: "{#gold}[クリックして再生]"

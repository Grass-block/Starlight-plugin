    resume: "{global#sys-info}プレイヤー{#var}が現在の再生を{#blue}再開{#gray}しました。"
    cancel: "{global#sys-info}プレイヤー{#var}が現在の再生を{#red}キャンセル{#gray}しました。"
    not-found: "{global#sys-error}指定されたファイル {#var} が見つかりません。"
    error-resolving: "{global#sys-error}指定されたファイル {#var} を解析できません。"

language:
  -module-name:
    music-player: ミュージックプレイヤー
  music-service:
    restore-defaults: "{global#sys-info}サンプル音楽ファイルを保存しました。"
    trim: "{global#sys-info}{#var} 個のファイルの名前形式を修正しました。"
  music-player:
    playing: "再生中"
    paused: "一時停止"
    play: "{global#sys-info}プレイヤー{#var}が音楽{#var}を再生しました(補正値:{#var})"
